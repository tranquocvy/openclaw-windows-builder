name: OpenClaw Windows quarantined builder (manual)
'on':
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: openclaw-windows-single-lane
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check dedicated public repository and first attempt
        timeout-minutes: 1
        env:
          EXPECTED_REPOSITORY: tranquocvy/openclaw-windows-builder
          ACTUAL_REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          ACTUAL_REF: ${{ github.ref }}
          HOSTED_KIND: ${{ runner.environment }}
          HOSTED_ARCH: ${{ runner.arch }}
          HOSTED_OS: ${{ runner.os }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if ($env:ACTUAL_REPOSITORY -ne $env:EXPECTED_REPOSITORY -or
              $env:RUN_ATTEMPT -ne '1' -or $env:EVENT_NAME -ne 'workflow_dispatch' -or
              $env:ACTUAL_REF -ne 'refs/heads/main' -or
              $env:HOSTED_KIND -cne 'github-hosted' -or $env:HOSTED_OS -cne 'Windows' -or
              $env:HOSTED_ARCH -cne 'X64' -or $env:REPO_PRIVATE -cne 'false') {
            throw 'Repository/event/attempt not admitted'
          }

      - name: Checkout public builder controls only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2, official tag verified
        timeout-minutes: 2
        with:
          repository: tranquocvy/openclaw-windows-builder
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false

      - name: Build pinned public source; never invoke Gateway or models
        timeout-minutes: 49
        env:
          CPA_RUN_ATTEMPT: ${{ github.run_attempt }}
          CPA_RUN_ID: ${{ github.run_id }}
          CPA_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          & ./scripts/Build.ps1

      - name: Non-executing candidate gate on this runner (not independent)
        timeout-minutes: 5
        env:
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
        run: |
          function Assert-BuilderControls {
            $expected = @('.gitattributes','.github/workflows/build-windows.yml','.gitignore','policy/artifact-policy.json','README.md','scripts/Build.ps1','scripts/test_candidate.py')
            $rows = @(Get-Content -LiteralPath ./PUBLIC_MANIFEST.sha256)
            if ($rows.Count -ne 7) { throw 'Builder manifest inventory' }
            $seen = @()
            foreach ($row in $rows) {
              if ($row -cnotmatch '^([0-9a-f]{64})  (.+)$') { throw 'Builder manifest syntax' }
              $digest = $Matches[1]; $path = $Matches[2]
              if ($expected -cnotcontains $path -or $seen -ccontains $path) { throw 'Builder manifest path' }
              $seen += $path
              if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant() -ne $digest) { throw 'Builder controls changed' }
            }
          }
          Assert-BuilderControls
          $python = (Get-Command python.exe -CommandType Application | Select-Object -First 1).Source
          & $python -I -B ./scripts/test_candidate.py --archive "$env:RUNNER_TEMP/cpa-export/openclaw-windows-candidate.zip" --checksums "$env:RUNNER_TEMP/cpa-export/SHA256SUMS" --policy ./policy/artifact-policy.json --report "$env:RUNNER_TEMP/cpa-export/gate-report.json" --workflow-sha $env:EXPECTED_WORKFLOW_SHA --run-id $env:EXPECTED_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Candidate gate failed; no upload' }
          $export = @(Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/cpa-export" -File -Force)
          if ($export.Count -ne 3 -or ($export | Measure-Object Length -Sum).Sum -gt 250MB) { throw 'Total upload cap' }
          function Assert-QuarantineBinding {
            $report = Get-Content -LiteralPath "$env:RUNNER_TEMP/cpa-export/gate-report.json" -Raw | ConvertFrom-Json
            $digest = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/cpa-export/openclaw-windows-candidate.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($report.archiveSha256 -cne $digest -or $report.status -cne 'QUARANTINED_CANDIDATE' -or
                $report.screening -cne 'CONSISTENCY_CHECK_PASS' -or $report.hostExecution -cne $false -or
                $report.independentSecurityBoundary -cne $false -or $report.runtimeQualification -cne 'UNRUN' -or
                $report.source -cne 'aedd9f3f56585d92ed14947df8c84ef6354f64cc' -or
                $report.workflowSha -cne $env:EXPECTED_WORKFLOW_SHA -or $report.runId -cne $env:EXPECTED_RUN_ID) {
              throw 'Quarantine receipt binding changed'
            }
          }
          Assert-QuarantineBinding

      - name: Upload quarantined candidate only after gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2, official tag verified
        timeout-minutes: 3
        with:
          name: openclaw-windows-quarantined-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cpa-export/openclaw-windows-candidate.zip
            ${{ runner.temp }}/cpa-export/SHA256SUMS
            ${{ runner.temp }}/cpa-export/gate-report.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false
